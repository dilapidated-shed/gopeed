name: Charcoal Flutter shared controls
on:
  pull_request:
    paths:
      - ui/flutter/**
      - .github/workflows/charcoal-flutter.yml
      - examples/autogenerated/charcoal-gopeed/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  shared-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-vendor@ff34c4100bc7063aab245f8088b4abee77df3e3a
        with:
          header: '-'
          resources: ui/flutter/android/app/src/main/res
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.41.6'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          repository: dilapidated-shed/grease
          run-id: 41253994123
          artifact-ids: 13062637698
          github-token: ${{ github.token }}
          merge-multiple: true
          path: grease
      - uses: isomorphisms/ai-ci/.github/actions/charcoal-grease@26e9289a364fc6654d8a1dc1840693ccdf12fd15
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo apt-get update
      - run: sudo apt-get install --no-install-recommends -y ripgrep
      - name: Analyze and run the established Flutter suite through Grease
        run: grease/bin/grease examples/autogenerated/charcoal-gopeed/check.grease
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: gopeed-charcoal-shared-control-evidence
          path: build/charcoal-gopeed/
          if-no-files-found: warn
